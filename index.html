*{box-sizing:border-box;margin:0}body{background:var(--ink);color:var(--tx);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}
nav{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 5vw;background:var(--nav);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;background:linear-gradient(90deg,var(--blue),var(--neon),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
nav .links{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.btn{display:inline-block;border:0;cursor:pointer;border-radius:99px;padding:10px 22px;background:linear-gradient(90deg,var(--blue),var(--neon));color:#fff;font-weight:600}
.btn.o{background:none;border:1px solid var(--cyan);color:var(--cyan)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hero{padding:6vh 5vw 10vh;text-align:center;background:radial-gradient(ellipse at 50% 0,var(--hero) 0,transparent 60%),radial-gradient(circle at 85% 30%,rgba(168,85,247,.25),transparent 40%)}
.hero h1{font-size:clamp(40px,8vw,88px);line-height:1.05;font-weight:800}
.hero p{max-width:560px;margin:20px auto;color:var(--mut)}.hero .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.orb{width:min(320px,70vw);margin:44px auto 0;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0,var(--blue),var(--neon),var(--cyan),var(--blue));filter:blur(30px);opacity:.55;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
section{padding:72px 5vw;max-width:1150px;margin:auto}h2{font-size:clamp(26px,4vw,38px);margin-bottom:28px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--navy);border:1px solid var(--ln);border-radius:14px;padding:20px;transition:border-color .2s}
a.card:hover{border-color:var(--neon)}.card h3{font-size:17px}.card p,.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--ln);margin-top:10px}.tag.l{border-color:var(--cyan);color:var(--cyan)}
.price{font-size:34px;font-weight:700;margin:6px 0}details{border-bottom:1px solid var(--ln);padding:14px 0}summary{cursor:pointer;font-weight:600}
footer{padding:36px 5vw;text-align:center;color:var(--mut);font-size:14px;border-top:1px solid var(--ln)}
.box{max-width:640px;margin:40px auto;padding:0 5vw}.box.s{max-width:400px}
input,textarea{width:100%;background:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:6px 0}
textarea{min-height:130px;resize:vertical}.err{color:#fb7185}.warn{color:#fbbf24;font-size:14px}
.out{white-space:pre-wrap;background:var(--navy);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-top:16px}.out img{max-width:100%;border-radius:8px}
.banner{background:#2a1f00;color:#fbbf24;text-align:center;font-size:13px;padding:6px 5vw}
.hist div{border-bottom:1px solid var(--ln);padding:8px 0;font-size:14px}
.chat .b{padding:12px 14px;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.chat .u{background:var(--bub);margin-left:12%}.chat .a{background:var(--navy);border:1px solid var(--ln);margin-right:6%}.cb{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--ink);padding:10px 0}.cb textarea{min-height:0;margin:0}:root{--nav:rgba(5,7,13,.9);--bub:#16224d;--hero:#1b2a6b}
[data-theme=light]{--ink:#f6f8fd;--navy:#fff;--tx:#0b1230;--mut:#5a6785;--ln:rgba(10,20,60,.15);--nav:rgba(246,248,253,.93);--bub:#dfe8ff;--hero:#cfdcff;color-scheme:light}
[data-theme=light] .btn.o{color:#0369a1;border-color:#0369a1}[data-theme=light] .warn{color:#92400e}
#auth{display:inline-flex;gap:18px;flex-wrap:wrap;align-items:center}
.tgl{padding:5px 12px!important;font-size:15px}.av{width:72px;height:72px;border-radius:50%;object-fit:cover}
.avl{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--neon));display:grid;place-items:center;font-size:30px;color:#fff}
summary{cursor:pointer}.logo{gap:10px}.lg{height:40px;width:auto;filter:drop-shadow(0 0 8px rgba(124,58,237,.55))}
.herologo{display:block;width:min(400px,84vw);margin:0 auto 18px;filter:drop-shadow(0 0 28px rgba(124,58,237,.5)) drop-shadow(0 0 12px rgba(34,211,238,.3))}</style></head><body>

function b64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>no(new Error("Could not read the file."));r.readAsDataURL(f)})}
async function toPayload(f){const t=f.type||"";
 if(t.startsWith("image/")){const url=URL.createObjectURL(f);try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("This image type is not supported. Use JPG or PNG."));i.src=url});
  const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
  return{name:f.name,mime:"image/jpeg",data:c.toDataURL("image/jpeg",.85).split(",")[1]}}finally{URL.revokeObjectURL(url)}}
 if(t==="application/pdf"||/\.pdf$/i.test(f.name)){if(f.size>10e6)throw new Error("PDF is too big. Max 10 MB.");return{name:f.name,mime:"application/pdf",data:await b64(f)}}
 if(t==="text/plain"||/\.txt$/i.test(f.name)){if(f.size>2e6)throw new Error("Text file is too big. Max 2 MB.");return{name:f.name,mime:"text/plain",data:await b64(f)}}
 throw new Error("Supported files: images (JPG/PNG), PDF and TXT. For Word files, save as PDF first.")}

 const NB="Login does not work here. Open https://zyvoraaitool.github.io/zyvora-Ai-/ in Chrome (not the downloaded file).";
 let rb=false;const run=async f=>{if(rb)return;const c=chk();if(!c)return;if(BLOCKED){$("#e").textContent=NB;return}if(!auth){ls.set("zy_user",{email:c[0]});return fin()}rb=true;$("#e").textContent="";try{await f(auth,c[0],c[1]);rb=false;fin()}catch(x){rb=false;$("#e").textContent=em(x)}};
 $("#fp").onclick=async ev=>{ev.preventDefault();const m=$("#em").value.trim();if(!/^\S+@\S+\.\S+$/.test(m)){$("#e").textContent="Type your email above first.";return}if(!auth){$("#e").textContent=NB;return}try{await sendPasswordResetEmail(auth,m);$("#e").textContent="Reset link sent. Check your email."}catch(x){$("#e").textContent=em(x)}};
 $("#in").onclick=()=>run(signInWithEmailAndPassword);
 $("#up").onclick=()=>run(async(a,e,pw)=>{const r=await createUserWithEmailAndPassword(a,e,pw);const n=$("#nmI").value.trim();if(n)await updateProfile(r.user,{displayName:n})});
 $("#gg").onclick=async()=>{if(BLOCKED){$("#e").textContent=NB;return}if(!auth){$("#e").textContent="Google login needs Firebase. Paste your config in CONFIG and enable Google in Firebase Authentication.";return}
  if(gb)return;gb=true;try{await signInWithPopup(auth,new GoogleAuthProvider());fin()}catch(x){$("#e").textContent=em(x)}gb=false;}}
function hk(){return "zy_hist_"+user.uid}
function getH(){return ls.get(hk(),[])}
function addH(x){const h=getH();h.unshift(x);ls.set(hk(),h.slice(0,100))}
function fmt(t){return esc(String(t)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^\s*\*\s+/gm,"• ").replace(/\n/g,"<br>")}
function dt(t){try{return new Date(t).toLocaleString()}catch(e){return""}}
function hItem(g){return `<details class="card" style="margin:10px 0"><summary><b>${esc(g.tool)}</b> · <span class="mut">${esc(dt(g.at))}</span><br>${esc(String(g.prompt).slice(0,90))}</summary><p style="margin-top:10px"><b>You:</b> ${esc(g.prompt)}</p><p style="margin-top:8px"><b>AI:</b><br>${fmt(g.reply||"")}</p></details>`}
function dash(){if(!user){location.hash="#/login";return}const h=getH();
 app.innerHTML=`<div class="box"><h2>Hi, ${esc(user.name||user.email.split("@")[0])} 👋</h2>
 <div class="grid"><div class="card"><p>Plan</p><div class="price">Free</div></div><div class="card"><p>Chats saved</p><div class="price">${h.length}</div></div></div>
 <p style="margin:18px 0"><a class="btn" href="#/tool/chat">AI Chatbot</a> <a class="btn o" href="#/tool/writer">Content Writer</a></p>
 <h2 style="margin-top:28px">Recent</h2>${h.length?h.slice(0,5).map(hItem).join("")+'<p><a class="mut" href="#/history">See all history →</a></p>':'<p class="mut">Nothing yet. Open a tool and ask something.</p>'}</div>`}
function hist(){if(!user){location.hash="#/login";return}const h=getH();
 app.innerHTML=`<div class="box"><h2>History</h2><p class="mut">Saved in this browser for your account.</p>${h.length?h.map(hItem).join("")+'<br><button class="btn o" id="ch">Clear history</button>':'<p class="mut">No history yet.</p>'}</div>`;
 const c=$("#ch");if(c)c.onclick=()=>{if(confirm("Delete all saved history on this device?")){ls.set(hk(),[]);hist()}}}
function profile(){if(!user){location.hash="#/login";return}
 app.innerHTML=`<div class="box"><h2>Profile</h2><div id="av" style="margin:14px 0"></div>
 <p class="mut">Email</p><p>${esc(user.email)}</p><p class="mut" style="margin-top:10px">Member since</p><p>${user.created?esc(new Date(user.created).toLocaleDateString()):"-"}</p><p class="mut" style="margin-top:10px">Plan</p><p>Free</p>
 <p class="mut" style="margin-top:14px">Display name</p><input id="nm" maxlength="40" placeholder="Your name"><button class="btn" id="sv">Save name</button>
 <p class="err" id="e" style="margin-top:8px"></p><hr style="border:0;border-top:1px solid var(--ln);margin:20px 0">
 <button class="btn o" id="rp">Send password reset email</button> <button class="btn o" id="ch">Clear history</button> <button class="btn o" id="lo">Log out</button></div>`;
 const av=$("#av");if(user.photo){const im=document.createElement("img");im.className="av";im.alt="";im.referrerPolicy="no-referrer";im.src=user.photo;av.appendChild(im)}else{av.innerHTML='<div class="avl"></div>';av.firstChild.textContent=(user.name||user.email)[0].toUpperCase()}
 $("#nm").value=user.name||"";const msg=t=>{$("#e").textContent=t};
 $("#sv").onclick=async()=>{const v=$("#nm").value.trim();if(!auth){msg("Needs Firebase login.");return}try{await updateProfile(auth.currentUser,{displayName:v});await loadUser();msg("Saved.")}catch(x){msg(x.message)}};
 $("#rp").onclick=async()=>{if(!auth){msg("Needs Firebase login.");return}try{await sendPasswordResetEmail(auth,user.email);msg("Reset link sent to your email.")}catch(x){msg(x.message)}};
 $("#ch").onclick=()=>{if(confirm("Delete all saved history on this device?")){ls.set(hk(),[]);msg("History cleared.")}};
 $("#lo").onclick=async()=>{auth?await signOut(auth):ls.set("zy_user",null);await loadUser();location.hash="#/"}}
async function route(){await loadUser();const h=location.hash.replace(/^#\/?/,"").split("/");try{
 if(h[0]==="tool")tool(h[1]);else if(h[0]==="tools")tools();else if(h[0]==="login")login();else if(h[0]==="dashboard")dash();else if(h[0]==="history")hist();else if(h[0]==="profile")profile();
 else if(h[0]==="pricing"){app.innerHTML=pricing()}else if(h[0]==="faq"){app.innerHTML=faq()}else home();
 if(!h[0]||h[0]==="")window.scrollTo(0,0)}catch(e){app.innerHTML='<div class="box"><p class="err">Page error: '+esc(e.message)+'</p></div>'}}
$("#yr").textContent=new Date().getFullYear();
$("#banner").remove();
const th=$("#th");function setTh(t){document.documentElement.dataset.theme=t;th.textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("zy_theme",t)}catch(e){}}
th.onclick=()=>setTh(document.documentElement.dataset.theme==="dark"?"light":"dark");setTh(document.documentElement.dataset.theme||"dark");
addEventListener("hashchange",route);route();
</script></body></html>
