<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZYVORA AI – Imagine More. Create Beyond.</title>
<meta name="description" content="ZYVORA AI: image, chat, writing, voice and more AI tools in one platform.">
<meta property="og:title" content="ZYVORA AI"><meta property="og:description" content="Imagine More. Create Beyond.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
:root{--ink:#05070d;--navy:#0a1128;--blue:#2f7bff;--neon:#a855f7;--cyan:#22d3ee;--tx:#e6ecff;--mut:#8b98bd;--ln:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}body{background:var(--ink);color:var(--tx);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}
nav{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 5vw;background:rgba(5,7,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;background:linear-gradient(90deg,var(--blue),var(--neon),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
nav .links{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.btn{display:inline-block;border:0;cursor:pointer;border-radius:99px;padding:10px 22px;background:linear-gradient(90deg,var(--blue),var(--neon));color:#fff;font-weight:600}
.btn.o{background:none;border:1px solid var(--cyan);color:var(--cyan)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hero{padding:15vh 5vw 12vh;text-align:center;background:radial-gradient(ellipse at 50% 0,#1b2a6b 0,transparent 60%),radial-gradient(circle at 85% 30%,rgba(168,85,247,.25),transparent 40%)}
.hero h1{font-size:clamp(40px,8vw,88px);line-height:1.05;font-weight:800}
.hero p{max-width:560px;margin:20px auto;color:var(--mut)}.hero .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.orb{width:min(320px,70vw);margin:44px auto 0;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0,var(--blue),var(--neon),var(--cyan),var(--blue));filter:blur(30px);opacity:.55;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
section{padding:72px 5vw;max-width:1150px;margin:auto}h2{font-size:clamp(26px,4vw,38px);margin-bottom:28px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--navy);border:1px solid var(--ln);border-radius:14px;padding:20px;transition:border-color .2s}
a.card:hover{border-color:var(--neon)}.card h3{font-size:17px}.card p,.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--ln);margin-top:10px}.tag.l{border-color:var(--cyan);color:var(--cyan)}
.price{font-size:34px;font-weight:700;margin:6px 0}details{border-bottom:1px solid var(--ln);padding:14px 0}summary{cursor:pointer;font-weight:600}
footer{padding:36px 5vw;text-align:center;color:var(--mut);font-size:14px;border-top:1px solid var(--ln)}
.box{max-width:640px;margin:40px auto;padding:0 5vw}.box.s{max-width:400px}
input,textarea{width:100%;background:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:6px 0}
textarea{min-height:130px;resize:vertical}.err{color:#fb7185}.warn{color:#fbbf24;font-size:14px}
.out{white-space:pre-wrap;background:var(--navy);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-top:16px}.out img{max-width:100%;border-radius:8px}
.banner{background:#2a1f00;color:#fbbf24;text-align:center;font-size:13px;padding:6px 5vw}
.hist div{border-bottom:1px solid var(--ln);padding:8px 0;font-size:14px}
.chat .b{padding:12px 14px;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.chat .u{background:#16224d;margin-left:12%}.chat .a{background:var(--navy);border:1px solid var(--ln);margin-right:6%}.cb{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--ink);padding:10px 0}.cb textarea{min-height:0;margin:0}</style></head><body>
<div class="banner" id="banner"></div>
<nav><a class="logo" href="#/"><svg viewBox="0 0 32 32" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#2f7bff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path d="M5 5h22L11 27h16" stroke="url(#g)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>ZYVORA AI</a>
<div class="links"><a href="#/tools">Tools</a><a href="#/pricing">Pricing</a><a href="#/faq">FAQ</a><span id="auth"></span></div></nav>
<main id="app"></main>
<footer>© <span id="yr"></span> ZYVORA AI · Imagine More. Create Beyond.</footer>
<script type="module">
let FA={},FB={};
try{[FA,FB]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")])}catch(e){}
const {initializeApp}=FA,{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut,onAuthStateChanged}=FB;
/* ====== CONFIG: paste your Firebase WEB config here (it is public, safe) ====== */
const CFG={
  FIREBASE:{apiKey:"AIzaSyA0BNzUM-oDfyeWt1bL3UGSsHCT5lreDXU",authDomain:"zyvora-ai-48975.firebaseapp.com",projectId:"zyvora-ai-48975",appId:"1:492537650922:web:e8d9ab86508acd8cc14193"},
  AI_ENDPOINT:"https://zyvora-ai-1.zdxyzofficial.workers.dev/api/chat"  // your Vercel function (keys stay in Vercel settings)
};
const TOOLS=[
["chat","AI Chatbot","Ask questions and brainstorm with an assistant.",1],
["writer","AI Content Writer","Blog posts, ads and emails from a short brief.",1],
["image","AI Image Generator","Turn a description into an image.",5],
["video","AI Video Generator","Short clips from text prompts.",20],
["logo","AI Logo Maker","Logo concepts from your brand name.",5],
["voice","AI Voice Generator","Natural voices for narration.",3],
["bgremove","AI Background Remover","Cut subjects out of photos.",2],
["enhance","AI Photo Enhancer","Sharpen and upscale photos.",2],
["tts","AI Text to Speech","Read any text aloud as audio.",2],
["ocr","AI Image to Text","Extract text from images.",2]];
const LIVE_TOOLS=["chat","writer"];let auth=null;try{if(CFG.FIREBASE.apiKey&&initializeApp)auth=getAuth(initializeApp(CFG.FIREBASE))}catch(e){}
const BLOCKED=!!CFG.FIREBASE.apiKey&&!auth;
const $=s=>document.querySelector(s),app=$("#app");
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let user=null;
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function authReady(){return new Promise(res=>{let un=()=>{};const t=setTimeout(()=>{un();res(null)},4000);
 un=onAuthStateChanged(auth,u=>{clearTimeout(t);un();res(u)},()=>{clearTimeout(t);res(null)})})}
async function loadUser(){ try{ if(auth){const u=await authReady();user=u?{email:u.email,tok:()=>auth.currentUser.getIdToken()}:null}else user=ls.get("zy_user",null)}catch(e){user=null}
 $("#auth").innerHTML=user?'<a href="#/dashboard">Dashboard</a>':'<a class="btn" href="#/login" style="padding:6px 16px">Get started</a>'}
function acct(){return ls.get("zy_acct",{credits:20,plan:"Free",hist:[]})}
function home(){app.innerHTML=`<div class="hero"><h1>Imagine More.<br>Create Beyond.</h1><p>Ten AI tools, one credit balance. Write, design and speak ideas into existence.</p>
<div class="row"><a class="btn o" href="#/tools">Explore AI Tools</a><a class="btn" href="#/login">Get Started</a></div><div class="orb" aria-hidden="true"></div></div>
<section><h2>Why ZYVORA</h2><div class="grid">
<div class="card"><h3>One balance</h3><p>Every tool draws from the same credits.</p></div>
<div class="card"><h3>Your history</h3><p>See every prompt and result in your dashboard.</p></div>
<div class="card"><h3>Works on any screen</h3><p>Built for phone, tablet and desktop.</p></div></div></section>
<section><h2>AI tools</h2><div class="grid">${toolCards()}</div></section>${pricing()}${testi()}${faq()}`}
function toolCards(){return TOOLS.map(t=>`<a class="card" href="#/tool/${t[0]}"><h3>${t[1]}</h3><p>${t[2]}</p><span class="tag ${LIVE_TOOLS.includes(t[0])?"l":""}">${LIVE_TOOLS.includes(t[0])?"Live":"Coming soon"}</span></a>`).join("")}
function pricing(){return `<section id="pricing"><h2>Pricing</h2><div class="grid"><div class="card"><h3>Free</h3><div class="price">$0</div><p>Chat and Content Writer · Fair-use limits</p></div>
<div class="card" style="border-color:var(--neon)"><h3>Premium</h3><div class="price">Coming soon</div><p>More credits and priority speed. Payments need a backend (e.g. Stripe).</p></div></div></section>`}
function testi(){return `<section><h2>What early users say</h2><div class="grid"><div class="card"><p>Sample testimonial. Replace with real customer feedback before launch.</p></div><div class="card"><p>Sample testimonial. Replace with real customer feedback before launch.</p></div></div></section>`}
function faq(){return `<section id="faq"><h2>FAQ</h2>
<details><summary>Are the tools real?</summary><p class="mut">Chatbot and Content Writer are live and use a real AI model. The other tools are marked Coming soon.</p></details>
<details><summary>Is my data safe?</summary><p class="mut">Sign-in uses Firebase Authentication when configured. API keys stay on the backend, never in this page.</p></details>
<details><summary>How do credits work?</summary><p class="mut">Each tool shows its cost. Free accounts start with 20 credits.</p></details></section>`}
function tools(){app.innerHTML=`<section><h2>AI tools</h2><div class="grid">${toolCards()}</div></section>`}
function tool(slug){const t=TOOLS.find(x=>x[0]===slug);
 if(!t){app.innerHTML='<div class="box"><p>Tool not found. <a href="#/tools" class="mut">See all tools</a></p></div>';return}
 if(!LIVE_TOOLS.includes(slug)){app.innerHTML=`<div class="box"><a href="#/tools" class="mut">← All tools</a><h2 style="margin-top:12px">${t[1]}</h2><p class="mut">Coming soon. This tool needs a paid media AI service and is not available yet.</p></div>`;return}
 if(!user){location.hash="#/login";return}
 const msgs=[];
 app.innerHTML=`<div class="box chat"><a href="#/tools" class="mut">← All tools</a><h2 style="margin-top:12px">${t[1]}</h2><div id="m"></div><p class="err" id="e"></p>
 <div class="cb"><textarea id="p" rows="2" maxlength="4000" placeholder="${slug==="writer"?"Describe what to write…":"Message ZYVORA AI…"}"></textarea><button class="btn" id="go">Send</button></div></div>`;
 const m=$("#m"),p=$("#p"),go=$("#go");
 const add=(c,r)=>{const d=document.createElement("div");d.className="b "+r;d.textContent=c;m.appendChild(d);d.scrollIntoView({block:"end"});return d};
 async function send(){const q=p.value.trim();if(q.length<1||go.disabled)return;$("#e").textContent="";
  msgs.push({role:"user",content:q});add(q,"u");p.value="";go.disabled=true;go.textContent="…";const w=add("Thinking…","a");
  try{const r=await fetch(CFG.AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await user.tok()},body:JSON.stringify({tool:slug,messages:msgs.slice(-20)})});
   let j={};try{j=await r.json()}catch{}
   if(!r.ok)throw new Error(j.error||("Request failed ("+r.status+")"));
   w.textContent=j.result;msgs.push({role:"assistant",content:j.result});
   const a=acct();a.hist.unshift({tool:t[1],prompt:q.slice(0,120)});a.hist=a.hist.slice(0,50);ls.set("zy_acct",a);
  }catch(x){w.remove();msgs.pop();$("#e").textContent=x.message}
  go.disabled=false;go.textContent="Send"}
 go.onclick=send;p.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}}
function login(){app.innerHTML=`<div class="box s"><h2>Log in</h2>
 ${auth?"":'<p class="warn">Demo sign-in: stored only in this browser. Paste your Firebase config in CONFIG for real accounts.</p>'}
 <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
 <p class="err" id="e"></p><button class="btn" id="in" style="width:100%">Log in</button><br><br>
 <button class="btn o" id="up" style="width:100%">Create account</button><br><br>
 <button class="btn o" id="gg" style="width:100%">Continue with Google</button></div>`;
 const chk=()=>{const e=$("#em").value.trim(),p=$("#pw").value;if(!/^\S+@\S+\.\S+$/.test(e)||p.length<8){$("#e").textContent="Enter a valid email and a password of 8+ characters.";return null}return[e,p]};
 const fin=async()=>{await loadUser();location.hash="#/dashboard"};
 const em=x=>({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"This email already has an account. Log in instead.","auth/weak-password":"Password is too weak.","auth/popup-closed-by-user":"Google sign-in was closed.","auth/unauthorized-domain":"Add this site's domain in Firebase → Authentication → Settings → Authorized domains."}[x.code]||x.message);
 const NB="Login could not load in this viewer. Open the site in Chrome or Safari.";
 const run=async f=>{const c=chk();if(!c)return;if(BLOCKED){$("#e").textContent=NB;return}if(!auth){ls.set("zy_user",{email:c[0]});return fin()}try{await f(auth,c[0],c[1]);fin()}catch(x){$("#e").textContent=em(x)}};
 $("#in").onclick=()=>run(signInWithEmailAndPassword);
 $("#up").onclick=()=>run(createUserWithEmailAndPassword);
 $("#gg").onclick=async()=>{if(BLOCKED){$("#e").textContent=NB;return}if(!auth){$("#e").textContent="Google login needs Firebase. Paste your config in CONFIG and enable Google in Firebase Authentication.";return}
  try{await signInWithPopup(auth,new GoogleAuthProvider());fin()}catch(x){$("#e").textContent=em(x)}}}
function dash(){if(!user){location.hash="#/login";return}const a=acct();
 app.innerHTML=`<div class="box"><h2>Dashboard</h2><div class="card"><p>${esc(user.email)}</p><p class="mut">Plan: Free</p></div>
 <h2 style="margin-top:32px">History</h2><div class="hist">${a.hist.length?a.hist.map(h=>`<div><b>${esc(h.tool)}</b>: ${esc(h.prompt)}</div>`).join(""):'<p class="mut">Nothing yet. Open a tool and generate something.</p>'}</div>
 <br><button class="btn o" id="lo">Log out</button></div>`;
 $("#lo").onclick=async()=>{auth?await signOut(auth):ls.set("zy_user",null);await loadUser();location.hash="#/"}}
async function route(){await loadUser();const h=location.hash.replace(/^#\/?/,"").split("/");try{
 if(h[0]==="tool")tool(h[1]);else if(h[0]==="tools")tools();else if(h[0]==="login")login();else if(h[0]==="dashboard")dash();
 else if(h[0]==="pricing"){app.innerHTML=pricing()}else if(h[0]==="faq"){app.innerHTML=faq()}else home();
 if(!h[0]||h[0]==="")window.scrollTo(0,0)}catch(e){app.innerHTML='<div class="box"><p class="err">Page error: '+esc(e.message)+'</p></div>'}}
$("#yr").textContent=new Date().getFullYear();
$("#banner").remove();
addEventListener("hashchange",route);route();
</script></body></html>
